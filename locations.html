<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全球據點地圖｜Northgo</title>
  <meta name="description" content="Northgo 全球辦公室地圖。一次顯示台北、台中、高雄、洛杉磯、胡志明市、東京與大阪，也可切換局部區域。">
  <meta name="theme-color" content="#0a1b33">
  <style>
    :root {
      --navy: #0a1b33;
      --cyan: #6ed4d0;
      --cyan-deep: #0b5f66;
      --ink: #0a1b33;
      --muted: #3e5168;
      --line: #d5e0ea;
      --bg: #f3f6fa;
      --card: #ffffff;
      --focus: #0b5f66;
      --ocean: #071422;
      --land: #1d5278;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "PingFang TC", "Hiragino Sans", "Yu Gothic UI", "Noto Sans", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    a {
      color: var(--cyan-deep);
    }

    button,
    a {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .skip {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      transform: translateY(-150%);
      background: #fff;
      color: var(--navy);
      padding: 0.75rem 1rem;
      z-index: 5;
    }

    .skip:focus {
      transform: none;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .top {
      background: var(--navy);
      color: #fff;
      padding: 0.85rem 1.25rem 0.9rem;
    }

    .top-row,
    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand span {
      color: var(--cyan);
    }

    .locales,
    .regions,
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .locales button,
    .regions button,
    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .locales button,
    .links a {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
      color: #fff;
    }

    .locales button[aria-pressed="true"] {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--navy);
      font-weight: 700;
    }

    .links a:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    h1 {
      margin: 0.7rem 0 0;
      font-size: clamp(1.45rem, 2.4vw, 2rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0.35rem 0 0;
      max-width: 46rem;
      color: #d5e4ef;
    }

    .regions {
      margin-top: 0.8rem;
      overflow-x: auto;
      flex-wrap: nowrap;
      padding-bottom: 0.15rem;
    }

    .regions button {
      flex: 0 0 auto;
      border: 0;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .regions button[aria-pressed="true"] {
      background: var(--cyan);
      color: var(--navy);
      font-weight: 700;
    }

    .count {
      margin-left: 0.35rem;
      font-variant-numeric: tabular-nums;
      opacity: 0.8;
    }

    .regions button[aria-pressed="true"] .count {
      opacity: 1;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .map-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      background: var(--ocean);
    }

    svg#map {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--ocean);
    }

    .land {
      fill: var(--land);
      stroke: #8ec4e2;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .grat {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .pin {
      cursor: pointer;
    }

    .pin .leader {
      stroke: #bffffc;
      stroke-width: 1.25;
    }

    .pin .anchor {
      fill: #bffffc;
    }

    .pin .halo {
      fill: rgba(110, 212, 208, 0.22);
      stroke: #9cf3ee;
      stroke-width: 1.5;
    }

    .pin .dot {
      fill: #6ed4d0;
    }

    .pin.is-head .dot {
      fill: #ffffff;
    }

    .pin.is-head .halo {
      stroke: #ffffff;
    }

    .pin.is-selected .halo {
      stroke: #ffffff;
      stroke-width: 3;
      fill: rgba(255, 255, 255, 0.2);
    }

    .pin.is-selected .dot {
      fill: #ffffff;
    }

    .pin .label {
      fill: #f7fffe;
      font-size: 12px;
      font-weight: 700;
      font-family: "Segoe UI", "PingFang TC", "Hiragino Sans", "Yu Gothic UI", "Noto Sans", sans-serif;
      paint-order: stroke;
      stroke: #06101c;
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .pin:focus {
      outline: none;
    }

    .pin:focus-visible .halo {
      stroke: #ffffff;
      stroke-width: 3;
    }

    .map-caption,
    .legend {
      position: absolute;
      z-index: 1;
      color: #f4f8fb;
      pointer-events: none;
    }

    .map-caption {
      left: 0.9rem;
      top: 0.8rem;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .map-caption p {
      margin: 0;
    }

    .map-caption .view-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .map-caption .view-count {
      color: #d5e4ef;
      font-size: 0.92rem;
    }

    .legend {
      left: 0.9rem;
      bottom: 0.8rem;
      display: flex;
      gap: 0.9rem;
      font-size: 0.85rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .swatch {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 3px rgba(110, 212, 208, 0.28);
    }

    .swatch.head {
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.28);
    }

    .panel {
      width: min(390px, 38vw);
      overflow: auto;
      padding: 1rem 1rem 1.5rem;
      background: var(--bg);
      border-left: 1px solid var(--line);
    }

    .panel h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .hint,
    .source {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    .source {
      margin-top: 0.9rem;
      font-size: 0.85rem;
    }

    .office-list {
      list-style: none;
      margin: 0.8rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.7rem;
    }

    .office-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 4px solid var(--cyan);
      border-radius: 14px;
    }

    .office-item.is-outside {
      opacity: 0.5;
    }

    .office-item.is-selected,
    .office-item:hover {
      opacity: 1;
    }

    .office-item.is-selected {
      border-color: var(--cyan-deep);
      box-shadow: 0 8px 24px rgba(10, 27, 51, 0.08);
    }

    .office {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      font: inherit;
      color: inherit;
      padding: 0.8rem 0.9rem;
      cursor: pointer;
      min-height: 44px;
    }

    .office-name {
      display: block;
      font-weight: 700;
    }

    .office-meta {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0.05rem 0.45rem;
      border-radius: 999px;
      background: var(--navy);
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 700;
      vertical-align: 0.1em;
    }

    .detail {
      padding: 0 0.9rem 0.9rem;
    }

    .detail address {
      font-style: normal;
      margin: 0;
    }

    .en-address {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .facts {
      margin: 0.7rem 0 0;
      padding: 0;
    }

    .facts div {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .facts dt {
      margin: 0;
      color: var(--muted);
    }

    .facts dd {
      margin: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.8rem;
    }

    .actions a,
    .actions button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .actions a:hover,
    .actions button:hover {
      border-color: var(--cyan-deep);
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100dvh;
      }

      .workspace {
        flex-direction: column;
      }

      .map-wrap {
        height: 68vh;
        min-height: 320px;
        flex: none;
      }

      .panel {
        width: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

      function office(id, head, home, email, tel, fax, maps, shortName, name, place, address) {
        return {
          id: id,

      var state = { locale: "zh-tw", region: "world", selected: null };
      var anim = 0;
      var svg = document.getElementById("map");
      var pins = {};

      function pack() {
        return COPY[state.locale];
      }

      function fill(template, values) {
        return template.replace(/\{(\w+)\}/g, function (_, key) {
          return values[key];
        });
      }

      function byId(id) {
        for (var i = 0; i < OFFICES.length; i++) {
          if (OFFICES[i].id === id) return OFFICES[i];
        }
        return null;
      }

      function reduceMotion() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function fitAspect(vb) {
        var rect = svg.getBoundingClientRect();
        if (!rect.width || !rect.height) return vb.slice();
        var target = rect.width / rect.height;
        var x = vb[0];
        var y = vb[1];
        var w = vb[2];
        var h = vb[3];
        if (w / h > target) {
          var nh = w / target;
          y -= (nh - h) / 2;
          h = nh;
        } else {
          var nw = h * target;
          x -= (nw - w) / 2;
          w = nw;
        }
        return [x, y, w, h];
      }

      function currentBox() {
        var box = svg.viewBox.baseVal;
        return [box.x, box.y, box.width, box.height];
      }

      function setBox(vb) {
        svg.setAttribute("viewBox", vb[0] + " " + vb[1] + " " + vb[2] + " " + vb[3]);
        layoutPins();
      }

      function goTo(region, animate) {
        var next = fitAspect(VIEWS[region]);
        var from = currentBox();
        var changed = state.region !== region;
        state.region = region;
        anim += 1;
        var token = anim;
        document.querySelectorAll(".regions button").forEach(function (button) {
          button.setAttribute("aria-pressed", button.getAttribute("data-region") === region ? "true" : "false");
        });
        updateCaption();
        if (changed) renderList();
        if (!animate || reduceMotion()) {
          setBox(next);
          return;
        }
        var t0 = performance.now();
        function frame(now) {
          if (token !== anim) return;
          var t = Math.min(1, (now - t0) / 480);
          var e = 1 - Math.pow(1 - t, 3);
          setBox(from.map(function (value, index) {
            return value + (next[index] - value) * e;
          }));
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        setTimeout(function () {
          if (token !== anim) return;
          setBox(fitAspect(VIEWS[region]));
        }, 520);
      }

      function pointInView(id) {
        var pos = POS[id];
        var box = currentBox();
        return pos[0] >= box[0] && pos[0] <= box[0] + box[2] && pos[1] >= box[1] && pos[1] <= box[1] + box[3];
      }

      function selectOffice(id) {
        var item = byId(id);
        if (REGION_IDS[state.region].indexOf(id) === -1 || !pointInView(id)) {
          state.selected = id;
          goTo(item.home, true);
        }
        state.selected = id;
        document.querySelectorAll(".pin").forEach(function (pin) {
          var on = pin.getAttribute("data-id") === id;
          pin.classList.toggle("is-selected", on);
          pin.setAttribute("aria-pressed", on ? "true" : "false");
          if (on) pin.parentNode.appendChild(pin);
        });
        renderList();
        layoutPins();
        var status = document.getElementById("locale-status");
        status.textContent = fill(pack().statusSelected, { name: item.name[state.locale] });
        var card = document.querySelector('.office-item[data-id="' + id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
      }

      function updateCaption() {
        var text = pack();
        var ids = REGION_IDS[state.region];
        document.getElementById("view-label").textContent = text[state.region];
        document.getElementById("view-count").textContent = state.region === "world"
          ? text.countAll
          : fill(text.countRegion, { n: ids.length });
        document.getElementById("map-title").textContent = text.h1;
        var status = document.getElementById("locale-status");
        if (!state.selected) {
          status.textContent = state.region === "world"
            ? text.statusAll
            : fill(text.statusRegion, { region: text[state.region], n: ids.length });
        }
      }

      function applyCopy() {
        var text = pack();
        document.documentElement.lang = text.htmlLang;
        document.title = text.title;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var value = text[el.getAttribute("data-i18n")];
          if (value == null) return;
          el.textContent = value;
        });
        document.querySelector(".locales").setAttribute("aria-label", text.localeLabel);
        document.querySelector(".regions").setAttribute("aria-label", text.regionLabel);
        document.getElementById("contact-link").href = CONTACT[state.locale];
        document.querySelectorAll("[data-locale]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.getAttribute("data-locale") === state.locale ? "true" : "false");
        });
        updateCaption();
        OFFICES.forEach(function (item) {
          var pin = pins[item.id];
          if (!pin) return;
          var label = item.shortName[state.locale];
          pin.querySelector("title").textContent = item.name[state.locale];
          pin.querySelector(".label").textContent = label;
          pin.setAttribute("aria-label", item.name[state.locale]);
        });
        renderList();
      }

      function renderList() {
        var list = document.getElementById("office-list");
        var text = pack();
        var visible = REGION_IDS[state.region];
        list.innerHTML = "";
        OFFICES.forEach(function (item) {
          var li = document.createElement("li");
          li.className = "office-item";
          li.setAttribute("data-id", item.id);
          if (visible.indexOf(item.id) === -1) li.classList.add("is-outside");
          if (state.selected === item.id) li.classList.add("is-selected");

          var button = document.createElement("button");
          button.type = "button";
          button.className = "office";
          button.setAttribute("aria-pressed", state.selected === item.id ? "true" : "false");
          var name = document.createElement("span");
          name.className = "office-name";
          name.textContent = item.name[state.locale];
          if (item.head) {
            var badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = text.head;
            name.appendChild(badge);
          }
          var meta = document.createElement("span");
          meta.className = "office-meta";
          meta.textContent = item.place[state.locale];
          button.appendChild(name);
          button.appendChild(meta);
          button.addEventListener("click", function () {
            selectOffice(item.id);
          });
          li.appendChild(button);

          if (state.selected === item.id) {
            var detail = document.createElement("div");
            detail.className = "detail";
            var address = document.createElement("address");
            address.textContent = item.address[state.locale];
            detail.appendChild(address);
            if (item.address[state.locale] !== item.maps) {
              var en = document.createElement("p");
              en.className = "en-address";
              en.textContent = item.maps;
              detail.appendChild(en);
            }
            var facts = document.createElement("dl");
            facts.className = "facts";
            addFact(facts, text.tel, item.tel, "tel:" + item.tel.replace(/-/g, ""));
            if (item.fax) addFact(facts, text.fax, item.fax, "");
            addFact(facts, text.email, item.email, "mailto:" + item.email);
            detail.appendChild(facts);
            var actions = document.createElement("div");
            actions.className = "actions";
            var mapLink = document.createElement("a");
            mapLink.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.maps);

            focus.type = "button";
            focus.textContent = text.focus;
            focus.addEventListener("click", function () {
              state.selected = item.id;
              goTo(item.home, true);
            });
            actions.appendChild(mapLink);
            if (state.region !== item.home) actions.appendChild(focus);
            detail.appendChild(actions);
            li.appendChild(detail);
          }
          list.appendChild(li);
        });
      }

      function addFact(dl, label, value, href) {
        var dt = document.createElement("dt");
        dt.textContent = label;
        var dd = document.createElement("dd");
        if (href) {
          var link = document.createElement("a");
          link.href = href;
          link.textContent = value;
          dd.appendChild(link);
        } else {
          dd.textContent = value;
        }
        dl.appendChild(dt);
        dl.appendChild(dd);
      }

      function buildPins() {
        var layer = document.getElementById("pins");
        OFFICES.forEach(function (item) {
          var pos = POS[item.id];
          var pin = document.createElementNS(SVGNS, "g");
          pin.setAttribute("class", "pin" + (item.head ? " is-head" : ""));
          pin.setAttribute("data-id", item.id);
          pin.setAttribute("transform", "translate(" + pos[0] + " " + pos[1] + ")");
          pin.setAttribute("role", "button");
          pin.setAttribute("tabindex", "0");
          pin.setAttribute("aria-pressed", "false");
          var title = document.createElementNS(SVGNS, "title");
          pin.appendChild(title);
          var screen = document.createElementNS(SVGNS, "g");
          screen.setAttribute("class", "screen");
          var leader = document.createElementNS(SVGNS, "line");
          leader.setAttribute("class", "leader");
          leader.setAttribute("x1", "0");
          leader.setAttribute("y1", "0");
          var anchor = document.createElementNS(SVGNS, "circle");
          anchor.setAttribute("class", "anchor");
          anchor.setAttribute("r", "2.4");
          var marker = document.createElementNS(SVGNS, "g");
          marker.setAttribute("class", "marker");
          var hit = document.createElementNS(SVGNS, "circle");
          hit.setAttribute("r", "16");
          hit.setAttribute("fill", "transparent");
          var halo = document.createElementNS(SVGNS, "circle");
          halo.setAttribute("class", "halo");
          halo.setAttribute("r", "11");
          var dot = document.createElementNS(SVGNS, "circle");
          dot.setAttribute("class", "dot");
          dot.setAttribute("r", "5.5");
          var label = document.createElementNS(SVGNS, "text");
          label.setAttribute("class", "label");
          marker.appendChild(hit);
          marker.appendChild(halo);
          marker.appendChild(dot);
          marker.appendChild(label);
          screen.appendChild(leader);
          screen.appendChild(anchor);
          screen.appendChild(marker);
          pin.appendChild(screen);
          layer.appendChild(pin);
          pins[item.id] = pin;
        });
      }

      function placeColumn(group, colX, spread) {
        group.sort(function (a, b) {
          return a.sy - b.sy || a.sx - b.sx;
        });
        var cy = 0;
        group.forEach(function (point) { cy += point.sy; });
        cy /= group.length;
        var total = (group.length - 1) * spread;
        group.forEach(function (point, index) {
          point.ox = colX - point.sx;
          point.oy = cy - total / 2 + index * spread - point.sy;
          point.side = true;
        });
      }

      function layoutPins() {
        var rect = svg.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var box = currentBox();
        var scale = Math.min(rect.width / box[2], rect.height / box[3]);
        var unit = scale ? 1 / scale : 1;
        var placed = OFFICES.map(function (item) {
          return {
            id: item.id,
            sx: (POS[item.id][0] - box[0]) * scale,
            sy: (POS[item.id][1] - box[1]) * scale,
            ox: 0,
            oy: 0,
            side: false
          };
        });

        if (state.region === "world") {
          var asia = placed.filter(function (point) { return point.id !== "lax"; });
          var lax = placed.filter(function (point) { return point.id === "lax"; })[0];
          var maxX = asia[0].sx;
          asia.forEach(function (point) { if (point.sx > maxX) maxX = point.sx; });
          var colX = maxX + 56;
          if (lax && colX > lax.sx - 120) colX = lax.sx - 120;
          placeColumn(asia, colX, 28);
        } else {
          var used = {};
          var threshold = 32;
          placed.forEach(function (point) {
            if (used[point.id]) return;
            var group = [point];
            used[point.id] = true;
            var grew = true;
            while (grew) {
              grew = false;
              placed.forEach(function (other) {
                if (used[other.id]) return;
                for (var i = 0; i < group.length; i++) {
                  var dx = group[i].sx - other.sx;
                  var dy = group[i].sy - other.sy;
                  if (dx * dx + dy * dy < threshold * threshold) {
                    used[other.id] = true;
                    group.push(other);
                    grew = true;
                    break;
                  }
                }
              });
            }
            if (group.length < 2) return;
            var maxX = group[0].sx;
            group.forEach(function (item) { if (item.sx > maxX) maxX = item.sx; });
            placeColumn(group, maxX + 22, 26);
          });
        }

        placed.forEach(function (point) {
          var pin = pins[point.id];
          pin.querySelector(".screen").setAttribute("transform", "scale(" + unit + ")");
          var clustered = point.side;
          var marker = pin.querySelector(".marker");
          marker.setAttribute("transform", "translate(" + point.ox + " " + point.oy + ")");
          var leader = pin.querySelector(".leader");
          leader.setAttribute("x2", String(point.ox));
          leader.setAttribute("y2", String(point.oy));
          leader.style.display = clustered ? "" : "none";
          pin.querySelector(".anchor").style.display = clustered ? "" : "none";
          var label = pin.querySelector(".label");
          label.style.display = "";
          if (clustered) {
            label.setAttribute("x", "14");
            label.setAttribute("y", "4");
            label.setAttribute("text-anchor", "start");
          } else {
            label.setAttribute("x", "0");
            label.setAttribute("y", "-16");
            label.setAttribute("text-anchor", "middle");
          }
        });
      }

      buildPins();

      document.querySelector(".locales").addEventListener("click", function (event) {
        var button = event.target.closest("button[data-locale]");
        if (!button) return;
        state.locale = button.getAttribute("data-locale");
        try { sessionStorage.setItem("northgo-sitemap-locale", state.locale); } catch (err) {}
        applyCopy();
      });

      document.querySelector(".regions").addEventListener("click", function (event) {
        var button = event.target.closest("button[data-region]");
        if (!button) return;
        var region = button.getAttribute("data-region");
        if (state.selected && REGION_IDS[region].indexOf(state.selected) === -1) {
          state.selected = null;
          document.querySelectorAll(".pin.is-selected").forEach(function (pin) {
            pin.classList.remove("is-selected");
            pin.setAttribute("aria-pressed", "false");
          });
        }
        goTo(region, true);
      });

      svg.addEventListener("click", function (event) {
        var pin = event.target.closest(".pin");
        if (!pin) return;
        selectOffice(pin.getAttribute("data-id"));
      });

      svg.addEventListener("keydown", function (event) {
        var pin = event.target.closest(".pin");
        if (!pin) return;
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectOffice(pin.getAttribute("data-id"));
        }
      });

      window.addEventListener("resize", function () {
        goTo(state.region, false);
      });

      var saved = "zh-tw";
      try {
        var stored = sessionStorage.getItem("northgo-sitemap-locale");
        if (stored && COPY[stored]) saved = stored;
      } catch (err) {}
      state.locale = saved;
      applyCopy();
      requestAnimationFrame(function () {
        goTo("world", false);
      });
    })();
  </script>
</body>
</html>
